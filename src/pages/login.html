<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Inicia sesión en el Sistema de Gestión de Becas para administrar tus postulaciones.">
    <title>Iniciar Sesión | Sistema de Gestión de Becas</title>
    <!-- Enlace a estilos personalizados (reutilizando el sistema de diseño) -->
    <link rel="stylesheet" href="../estilos/main.css">
    <!-- Estilos específicos para la página de login -->
    <link rel="stylesheet" href="../estilos/login.css">
</head>

<body>

    <a href="index.html" class="back-to-home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Volver al Inicio
    </a>

    <main class="login-main">
        <div class="login-split-container">
            <div class="login-branding">
                <div class="brand-logo">
                    <img src="../assets/img/imglogo.png" alt="logoInsa">
                </div>
            </div>

            <div class="login-card-wrapper">
                <section class="login-container">
                    <div id="message-area"></div>

                    <form id="login-form">
                        <div class="form-group">
                            <input type="text" id="username" placeholder="Correo electrónico o nombre de usuario"
                                required>
                        </div>
                        <div class="form-group">
                            <input type="password" id="password" placeholder="Contraseña" required>
                        </div>
                        <button type="submit" class="btn-submit">Iniciar sesión</button>

                        <div style="text-align: center; margin-top: 15px;">
                            <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                        </div>

                        <div class="login-divider"></div>

                        <div style="text-align: center; margin-top: 20px; font-size: 15px;">
                            <span>¿Aún no estás registrado? </span>
                            <a href="registro.html"
                                style="color: #1877f2; text-decoration: none; font-weight: 600;">Regístrate aquí</a>
                        </div>
                    </form>
                </section>
            </div>
        </div>
    </main>

    <footer class="footer-login-simple">
        <div class="container text-center">
            <p>&copy; 2026 Sistema de Gestión de Becas - Transparencia y Oportunidad</p>
            <nav class="footer-links-bottom">
                <a href="index.html">Inicio</a>
                <a href="sedes.html">Sedes</a>
                <a href="#">Ayuda</a>
            </nav>
        </div>
    </footer>

    <script src="../js/login.js"></script>
</body>

</html>
