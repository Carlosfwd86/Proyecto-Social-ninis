<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Regístrate en el Sistema de Gestión de Becas para comenzar tu proceso de postulación.">
    <title>Registro de Postulantes | Sistema de Gestión de Becas</title>
    <link rel="stylesheet" href="../estilos/main.css">
    <link rel="stylesheet" href="../estilos/login.css">
</head>

<body>

    <a href="index.html" class="back-to-home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Volver al Inicio
    </a>

    <main class="login-main">
        <div class="login-split-container">
            <div class="login-branding">
                <div class="brand-logo">
                    <img src="../assets/img/imglogo.png" alt="logoInsa">
                </div>
                <h2 class="brand-tagline">Únete a nuestra comunidad y comienza tu futuro ahora.</h2>
            </div>

            <div class="login-card-wrapper">
                <section class="login-container" style="max-width: 450px;">
                    <div id="message-area"></div>

                    <form id="registration-form">
                        <div class="form-group">
                            <input type="text" id="fullname" name="fullname" placeholder="Nombre completo" required>
                        </div>
                        <div class="form-group">
                            <input type="email" id="email" name="email" placeholder="Correo electrónico" required>
                        </div>
                        <div class="form-group">
                            <input type="password" id="password" name="password" placeholder="Contraseña nueva"
                                required>
                        </div>

                        <p style="font-size: 11px; color: #777; margin: 10px 0;">
                            Al hacer clic en Registrarse, aceptas nuestras Condiciones, la Política de privacidad y la
                            Política de cookies.
                        </p>

                        <button type="submit" class="btn-submit" style="background-color: #42b72a;">Registrarte</button>

                        <div class="login-divider"></div>

                        <div style="text-align: center; margin-top: 10px;">
                            <a href="login.html"
                                style="color: #2ac712; text-decoration: none; font-weight: 600; font-size: 17px;">¿Ya
                                tienes una cuenta?</a>
                        </div>
                    </form>
                </section>
            </div>
        </div>
    </main>

    <footer class="footer-login-simple">
        <div class="container text-center">
            <p>&copy; 2026 Sistema de Gestión de Becas - Transparencia y Oportunidad</p>
            <nav class="footer-links-bottom">
                <a href="index.html">Inicio</a>
                <a href="sedes.html">Sedes</a>
                <a href="ayuda.html">Ayuda</a>
            </nav>
        </div>
    </footer>

    <script src="../js/session.js"></script>
    <script src="../js/registro.js"></script>
</body>

</html>
